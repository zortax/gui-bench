[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
explorer-app = { path = "crates/explorer-app" }
explorer-core = { path = "crates/explorer-core" }
explorer-data = { path = "crates/explorer-data" }
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
leptos = "=0.9.0-rc1"
leptos_axum = "=0.9.0-rc1"
leptos_meta = "=0.9.0-rc1"
leptos_router = "=0.9.0-rc1"
rayon = "1.12.0"
send_wrapper = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
# Exact float parsing: a value that crosses the wire as JSON equals the server value bit for
# bit, so the browser hydrates the markup the server rendered.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"

# Debug builds optimize a little, so the reactive runtime and the JSON parsing stay quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The wasm bundle of the frontend: small over fast.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[[workspace.metadata.leptos]]
name = "explorer"
bin-package = "explorer-server"
lib-package = "explorer-frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "assets"
site-addr = "127.0.0.1:3080"
reload-port = 3081
browserquery = "defaults"
env = "DEV"
lib-profile-release = "wasm-release"
