[package]
name = "explorer-app"
description = "Components, views and server functions of the gui-bench explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
explorer-core.workspace = true
explorer-data = { workspace = true, optional = true }
js-sys.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
send_wrapper.workspace = true
serde.workspace = true
tokio = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "Clipboard",
    "CssStyleDeclaration",
    "DomRect",
    "DomRectReadOnly",
    "Response",
    "ImageEncodeOptions",
    "Element",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "MediaQueryList",
    "Navigator",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Storage",
    "SvgElement",
    "Url",
    "Window",
    "XmlSerializer",
    "AddEventListenerOptions",
    "Document",
    "EventTarget",
    "HtmlDivElement",
    "HtmlElement",
    "MouseEvent",
    "Node",
    "NodeList",
    "PointerEvent",
    "SvgGraphicsElement",
    "SvgsvgElement",
    "WheelEvent",
] }

[features]
hydrate = ["leptos/hydrate"]
ssr = [
    "dep:explorer-data",
    "dep:tokio",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
