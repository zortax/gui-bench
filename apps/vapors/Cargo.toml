[package]
name = "vapors-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace]

[dependencies]
vapors-app = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729", default-features = false }
vapors-components = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729" }
vapors-dom = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729" }
vapors-elements = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729", default-features = false, features = ["complex-script-breaks", "grid"] }
vapors-platform = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729" }
vapors-renderer = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729" }
vapors-signals = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729" }
vapors-text = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729", default-features = false, features = ["complex-script-breaks"] }

[dev-dependencies]
vapors-gpu-harness = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729" }
vapors-scene = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729" }

[build-dependencies]
vapors-compiler = { git = "https://github.com/tomyan/vapors", rev = "9748354b20815e8c6424fabb6742d40748f41729" }
