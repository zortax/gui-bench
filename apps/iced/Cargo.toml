[package]
name = "iced-bench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
iced = { version = "0.14.0", features = ["advanced", "canvas", "tokio"] }

[features]
# The tuned edition: the orders, the list rows and the message cards are built inside iced's
# `lazy` widget, which rebuilds them only when their data changes.
tuned = ["iced/lazy"]

[profile.release]
debug = 1
