[package]
name = "zgui-bench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace, so the zgui stack resolves apart from every other app.
[workspace]

[dependencies]
zgui = { git = "https://github.com/zortax/zgui", branch = "feat/fakeland-marks", features = ["fakeland-marks"] }
zgui-ui = { git = "https://github.com/zortax/zgui", branch = "feat/fakeland-marks" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui", branch = "feat/fakeland-marks" }

[profile.release]
debug = 1

# The zgui branch reaches fakeland-marks through a path beside its checkout, which a git checkout
# lacks; this takes it from the fakeland repository instead.
[patch."https://github.com/zortax/zgui"]
fakeland-marks = { git = "https://github.com/zortax/fakeland", branch = "main" }
