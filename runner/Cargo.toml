[package]
name = "gui-bench"
description = "Runs the GUI framework benchmark matrix under fakeland"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fakeland = { version = "0.1.0", path = "../../fakeland/crates/fakeland", features = ["nvml"] }
fakeland-bench = { version = "0.1.0", path = "../../fakeland/crates/fakeland-bench" }
fakeland-trace = { version = "0.1.0", path = "../../fakeland/crates/fakeland-trace" }
fakeland-types = { version = "0.1.0", path = "../../fakeland/crates/fakeland-types" }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
