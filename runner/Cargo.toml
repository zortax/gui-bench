[package]
name = "gui-bench"
description = "Runs the GUI framework benchmark matrix under fakeland"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace, like each app, so the patches in a local `.cargo/config.toml` reach only the
# runner.
[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fakeland = { version = "0.1.0", git = "https://github.com/zortax/fakeland", branch = "main", features = ["nvml"] }
fakeland-bench = { version = "0.1.0", git = "https://github.com/zortax/fakeland", branch = "main" }
fakeland-trace = { version = "0.1.0", git = "https://github.com/zortax/fakeland", branch = "main" }
fakeland-types = { version = "0.1.0", git = "https://github.com/zortax/fakeland", branch = "main" }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
