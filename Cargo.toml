[workspace]
resolver = "2"
members = [
    "crates/bench-core",
    "crates/gui-bench",
    "adapters/zgui",
    "adapters/gpui",
]
default-members = ["crates/bench-core", "crates/gui-bench"]
exclude = ["vendor/gpui-ce"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
bench-core = { path = "crates/bench-core" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.bench-run]
inherits = "release"
debug = 1
lto = "thin"
codegen-units = 1
strip = "none"
