[workspace]
resolver = "3"
members = ["runner"]
# Each app is its own workspace with its own lock file, so the GUI stacks never share a resolve.
exclude = ["apps"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
